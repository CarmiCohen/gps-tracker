plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    id 'kotlin-kapt'
    alias(libs.plugins.hilt)
    alias(libs.plugins.protobuf)
    alias(libs.plugins.kotlin.serialization)
}

android {
    namespace 'com.gps19.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.gps19.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "Oct24.34"

        testInstrumentationRunner "com.gps19.app.HiltTestRunner"
        vectorDrawables {
            useSupportLibrary true
        }

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
            }
        }
    }

    buildTypes {
        debug {
            buildConfigField "boolean", "IS_PLATINUM", "false"
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField "boolean", "IS_PLATINUM", "true"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.14'
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
}

kapt {
    correctErrorTypes = true
}

dependencies {
    implementation project(':core:engine')
    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.androidx.lifecycle.service
    implementation libs.androidx.activity.compose
    implementation libs.androidx.preference.ktx
    implementation platform(libs.compose.bom)
    implementation libs.androidx.ui
    implementation libs.androidx.ui.graphics
    implementation libs.androidx.ui.tooling.preview
    implementation libs.androidx.material3
    implementation libs.material.icons.extended
    implementation libs.androidx.navigation.compose
    
    // UI - OSMDroid
    implementation libs.osmdroid.android

    // DI - Hilt
    implementation libs.hilt.android
    kapt libs.hilt.compiler
    implementation libs.hilt.navigation.compose
    implementation libs.hilt.work
    kapt libs.hilt.androidx.compiler

    // Storage - Room
    implementation libs.room.runtime
    implementation libs.room.ktx
    kapt libs.room.compiler

    // Storage - DataStore
    implementation libs.datastore

    // Networking
    implementation libs.okhttp
    implementation libs.socket.io.client

    // Serialization & Protocol Buffers
    implementation libs.protobuf.javalite
    implementation libs.kotlinx.serialization.json

    // Background Processing
    implementation libs.androidx.work.runtime.ktx

    // Utilities
    implementation libs.timber
    implementation libs.play.services.location

    testImplementation libs.junit
    testImplementation libs.mockito.core
    testImplementation libs.mockito.kotlin
    testImplementation libs.kotlinx.coroutines.test
    testImplementation testFixtures(project(":core:engine"))
    
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
    androidTestImplementation platform(libs.compose.bom)
    androidTestImplementation libs.androidx.ui.test.junit4
    
    // Hilt Testing
    androidTestImplementation libs.hilt.android.testing
    kaptAndroidTest libs.hilt.compiler
    kaptAndroidTest libs.hilt.androidx.compiler

    // UI Automator
    androidTestImplementation libs.androidx.uiautomator
    
    // Test Fixtures for AndroidTest
    androidTestImplementation testFixtures(project(":core:engine"))

    debugImplementation libs.androidx.ui.tooling
    debugImplementation libs.androidx.ui.test.manifest
}

protobuf {
    protoc {
        artifact = 'com.google.protobuf:protoc:3.25.1'
    }
    generateProtoTasks {
        all().each { task ->
            task.builtins {
                java {
                    option 'lite'
                }
            }
        }
    }
}
