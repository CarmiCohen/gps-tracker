syntax = "proto3";

option java_package = "com.gps19.app";
option java_multiple_files = true;

/**
 * AppSettings: Persistence schema for DataStore.
 * v8.9.79: Issue #014 - Type Migration. Standardized distance, accuracy, and temperature to double.
 * v8.9.84: Issue #023 - Binary Compatibility Fix.
 *          - Reverted tags 8, 9, 33 to float (legacy) to prevent SerializationException.
 *          - Added high-precision double fields at tags 60, 61, 62.
 *          - Preserved tag 49 for is_anchor_locked.
 */
message AppSettings {
    optional string app_mode = 1;
    optional string tracker_id = 2;
    optional string viewer_id = 3;
    optional string relay_url = 4;
    optional int64 app_start_time = 5;
    optional int64 last_alarm_ack_ts = 6;
    optional int64 home_points_ts = 7;

    // Legacy float fields (Binary compatibility for Issue #023)
    optional float legacy_max_distance = 8;
    optional float legacy_max_accuracy = 9;

    optional bool is_manual_exit = 10;

    reserved 11;
    optional int64 total_connected = 12;
    optional int64 max_drop = 13;
    optional int64 max_drop_ts = 14;
    optional int64 total_drop = 15;
    optional int64 uptime = 16;
    optional int64 last_connection_ts = 17;
    optional int64 last_disconnection_ts = 18;
    reserved 19;
    optional int64 last_gps_ts = 20;

    optional string selected_siren = 21;

    repeated GeoPointProto home_points = 22;
    optional AlertSettingsProto alert_settings = 23;
    optional TrackerStatusProto tracker_state = 24;

    optional bool migrated_from_preferences = 25;

    optional int32 last_auto_save_hour = 26;
    optional int64 last_service_tick_ts = 27;
    optional string last_daily_cleanup_date = 28;
    optional int64 max_accuracy_ts = 29;
    optional int64 last_auto_save_ts = 30;

    reserved 31;
    optional int32 last_version_code = 32;

    // Legacy float field (Binary compatibility for Issue #023)
    optional float legacy_max_temp = 33;

    optional double tracker_lux_baseline = 34;
    optional double tracker_acoustic_floor = 35;

    optional bool is_mic_type_started = 36;

    optional string draft_tracker_id = 37;
    optional string draft_viewer_id = 38;
    optional string draft_relay_url = 39;
    optional double draft_max_distance = 40;
    optional AlertSettingsProto draft_alert_settings = 41;

    optional int64 last_sit_ts = 42;
    optional double chair_baseline_tilt = 43;

    optional int64 violation_uptime_ms = 44;
    optional int64 last_service_tick_realtime = 45;
    optional string last_daily_archive_date = 46;

    optional bool is_xiaomi_manual_override = 47;

    optional int64 last_history_sit_ts = 48;
    optional bool is_anchor_locked = 49;

    // New high-precision fields (Issue #023)
    optional double max_distance = 60;
    optional double max_accuracy = 61;
    optional double max_temp = 62;
}

message RealtimeStatus {
    string id = 1;
    string viewer_id = 2;
    bool from_viewer = 3;
    double lat = 4;
    double lng = 5;
    double speed = 6;
    double bearing = 7;
    double accuracy = 8;
    double max_accuracy = 9;
    int32 battery = 10;
    double temp = 11;
    bool is_charging = 12;
    int64 ts = 13;
    int64 gps_ts = 14;
    int32 sats_view = 15;
    int32 sats_used = 16;
    int64 uptime_ms = 17;
    int64 total_connected_ms = 19;
    int64 session_connected_ms = 20;
    int64 total_drop_ms = 21;
    int64 max_drop_ms = 22;
    int64 last_conn_ts = 24;
    int64 last_disc_ts = 25;
    bool is_historical = 26;
    double alt = 27;

    // Parity Fields for Issue #051
    string tracker_state = 28;
    bool is_anchor_locked = 29;
    bool is_location_pending = 30;
    string location_pending_reason = 31;
    int64 last_valid_fix_realtime = 32;
    bool is_battery_steep_discharge = 33;
    bool is_cooling_mode_active = 34;
}

message GeoPointProto {
    double lat = 1;
    double lng = 2;
}

message AlertSettingsProto {
    bool local_internet = 1;
    bool server_connection = 2;
    bool jammer_detection = 3;
    bool signalLoss = 4;
    bool gps_stalling = 5;
    bool distance = 6;
    bool power = 7;
    bool low_battery = 8;
    bool long_time_gap = 9;
    bool high_temperature = 10;
    bool override_silence = 11;
    bool use_max_volume = 12;
    bool vibration_enabled = 13;
    float alarm_volume = 14;
    bool use_custom_volume = 15;
    bool relay_connection = 16;
    bool tilt_alert = 17;
    bool acoustic_alert = 18;
    bool lift_alert = 19;
    bool tamper_alert = 20;
    bool chair_occupied = 21;
    bool global_mute = 22;
    bool system_storage_low = 23;
    bool battery_health = 24;
}

message TrackerStatusProto {
    double lat = 1;
    double lng = 2;
    double speed = 3;
    double bearing = 4;
    double accuracy = 5;
    double max_accuracy = 22;
    int64 gps_ts = 6;
    int64 ts = 7;
    int64 uptime_ms = 8;
    int64 last_conn_ts = 9;
    int64 last_disc_ts = 10;
    int64 total_drop_ms = 11;
    int64 max_drop_ms = 12;
    int64 total_connected_ms = 15;
    int64 session_connected_ms = 16;
    int32 battery = 17;
    double temp = 18;
    bool is_charging = 19;
    int32 sats_view = 20;
    int32 sats_used = 21;
    double alt = 23;
    double max_temp = 24;

    bool is_sit_detected = 25;
    int64 last_sit_ts = 26;
    double vertical_velocity = 27;
    double sit_vz = 28;
    double sit_dz = 29;
    double sit_baro = 30;
    double sit_tilt = 31;
    double sit_shock = 32;

    int64 max_drop_ts = 33;
    int64 violation_uptime_ms = 34;
    double violation_percentage = 35;
    bool is_power_tamper = 36;

    double vibration = 37;
    double heading = 38;
    double baro_alt = 39;
    double lux = 40;
    bool is_near = 41;
    double tilt_degrees = 42;
    double acoustic_db = 43;
    double peak_shock = 44;
    int64 peak_shock_ts = 45;
    double lux_baseline = 46;
    double acoustic_floor = 47;
    double adaptive_vibration_floor = 48;
    double prox_idx = 49;
    bool is_suspicious = 50;
    bool is_tamper_detected = 51;
    string ver = 52;

    bool is_power_save_mode = 53;
    int32 standby_bucket = 54;
    string net_interface = 55;
    bool is_storage_low = 56;

    bool is_battery_steep_discharge = 57;

    bool is_jammer = 58;
    bool is_cooling_mode_active = 60;
    bool is_storage_critical = 61;

    int32 current_ma = 62;
    bool is_anchor_locked = 63;
    string tracker_state = 64;
}
