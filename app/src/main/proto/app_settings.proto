syntax = "proto3";

option java_package = "com.gps19.app";
option java_multiple_files = true;

/**
 * AppSettings: Persistence schema for DataStore.
 */
message AppSettings {
    optional string app_mode = 1;
    optional string tracker_id = 2;
    optional string viewer_id = 3;
    optional string relay_url = 4;
    optional int64 app_start_time = 5;
    optional int64 last_alarm_ack_ts = 6;
    optional int64 home_points_ts = 7;

    reserved 8, 9;

    optional bool is_manual_exit = 10;

    reserved 11;
    optional int64 total_connected = 12;
    optional int64 max_drop = 13;
    optional int64 max_drop_ts = 14;
    optional int64 total_drop = 15;
    optional int64 uptime = 16;
    optional int64 last_connection_ts = 17;
    optional int64 last_disconnection_ts = 18;
    reserved 19;
    optional int64 last_gps_ts = 20;

    optional string selected_siren = 21;

    repeated GeoPointProto home_points = 22;
    optional AlertSettingsProto alert_settings = 23;
    optional TrackerStatusProto tracker_state = 24;

    optional bool migrated_from_preferences = 25;

    optional int32 last_auto_save_hour = 26;
    optional int64 last_service_tick_ts = 27;
    optional string last_daily_cleanup_date = 28;
    optional int64 max_accuracy_ts = 29;
    optional int64 last_auto_save_ts = 30;

    reserved 31, 33;
    optional int32 last_version_code = 32;

    optional double tracker_lux_baseline = 34;
    optional double tracker_acoustic_floor = 35;

    optional bool is_mic_type_started = 36;

    optional string draft_tracker_id = 37;
    optional string draft_viewer_id = 38;
    optional string draft_relay_url = 39;
    optional double draft_max_distance = 40;
    optional AlertSettingsProto draft_alert_settings = 41;

    optional int64 violation_uptime_ms = 44;
    optional int64 last_service_tick_rt = 45;
    optional string last_daily_archive_date = 46;

    optional bool is_xiaomi_manual_override = 47;

    optional int64 clock_drift_ref = 50;

    optional double max_distance = 60;
    optional double max_accuracy = 61;
    optional double max_temp = 62;

    optional bool identity_sanitized = 63;

    optional bool is_system_active = 64;

    optional int64 last_sit_ts = 65;
    optional double chair_baseline_tilt = 66;
    optional int64 last_history_sit_ts = 67;

    reserved 68;

    optional bool is_recovery_pending = 69;
    optional int64 recovery_blocked_ts = 70;
    optional int64 cumulative_recovery_blackout_ms = 71;
    optional int32 recovery_count = 72;

    optional int64 first_violation_ts = 73;
    optional int64 first_violation_rt = 74;
    optional bool first_violation_was_jump = 75;
    optional int32 distance_violation_counter = 76;
    optional bool was_distance_violated = 77;
    optional bool power_alarm_pending = 78;
    optional int64 last_siren_stop_rt = 79;
    optional int64 last_global_trigger_rt = 80;
    optional int64 forensic_reliability_degradation_start_rt = 81;

    optional bool is_cooling_mode_active = 82;
    optional int64 cooling_entered_rt = 83;

    // Issue #OCT19.19-F1: Skip Restoration flag
    optional bool is_restoration_disabled = 84;

    map<string, int64> role_longs = 100;
    map<string, double> role_doubles = 101;
    map<string, bool> role_bools = 102;
    map<string, int32> role_ints = 103;
    map<string, string> role_strings = 104;
    map<string, TrackerStatusProto> role_states = 105;

    repeated ActiveAlarmProto active_alarms = 106;
    map<string, ActiveAlarmsListProto> role_alarms = 107;

    map<string, LogicStateProto> role_logic_states = 108;
}

enum TrackerStateProto {
    TS_UNKNOWN = 0;
    TS_MOVING = 1;
    TS_PARKING = 2;
    TS_JUMPING = 3;
    TS_OFFLINE = 4;
}

enum LocationPendingReasonProto {
    LPR_NONE = 0;
    LPR_GPS_STALL = 1;
    LPR_GPS_GAP = 2;
    LPR_ACOUSTIC_VIOLATION = 3;
    LPR_SIGNAL_LOSS = 4;
    LPR_JAMMER_SUSPICION = 5;
}

message LogicStateProto {
    optional int64 first_violation_ts = 1;
    optional int64 first_violation_rt = 2;
    optional bool first_violation_was_jump = 3;
    optional int32 distance_violation_counter = 4;
    optional bool was_distance_violated = 5;
    optional bool power_alarm_pending = 6;
    optional int64 last_global_trigger_rt = 7;
    optional int64 forensic_reliability_degradation_start_rt = 8;
    optional int64 last_siren_stop_rt = 9;
    optional int64 last_relay_online_rt = 10;
    optional int64 last_relay_offline_rt = 11;
    optional string boot_id = 12;
}

message RealtimeStatus {
    optional string id = 1;
    optional string viewer_id = 2;
    optional bool from_viewer = 3;
    optional double lat = 4;
    optional double lng = 5;
    optional double speed = 6;
    optional double bearing = 7;
    optional double accuracy = 8;
    optional double max_accuracy = 9;
    optional int32 battery = 10;
    optional double temp = 11;
    optional bool is_charging = 12;
    optional int64 ts = 13;
    optional int64 gps_ts = 14;
    optional int32 sats_view = 15;
    optional int32 sats_used = 16;
    optional int64 uptime_ms = 17;
    optional int32 rtt = 18;
    optional int64 total_connected_ms = 19;
    optional int64 session_connected_ms = 20;
    optional int64 total_drop_ms = 21;
    optional int64 max_drop_ms = 22;
    optional int64 last_conn_ts = 24;
    optional int64 last_disc_ts = 25;
    optional bool is_historical = 26;
    optional double alt = 27;

    optional TrackerStateProto state = 28;
    reserved 29;
    optional bool is_location_pending = 30;
    optional LocationPendingReasonProto pending_reason = 31;

    optional int64 last_valid_fix_rt = 32;
    optional bool is_battery_steep_discharge = 33;
    optional bool is_cooling_mode_active = 34;

    // Forensic Fields
    optional double snr_idx = 35;
    optional double noise_idx = 36;
    optional double lux_idx = 37;
    optional double vibe_idx = 38;
    optional double lift_idx = 39;
    optional double prox_idx = 40;
    optional bool is_sit_detected = 41;
    optional bool is_sit_active = 42;
    optional int64 last_sit_ts = 43;
    optional double sit_vz = 44;
    optional double sit_dz = 45;
    optional double tilt_idx = 46;
    optional double baro_idx = 47;
    optional double sit_baro = 48;
    optional double sit_tilt = 49;
    optional double sit_shock = 50;
    optional double vertical_velocity = 51;

    optional bool is_jammer = 52;
    optional bool is_stalled = 53;
    optional bool is_tamper_detected = 54;
    optional int32 jump_tier = 55;
    optional int64 gps_age_ms = 56;
    optional string sentinel_status = 57;

    optional bool is_clock_regression = 58;

    optional double kinetic_energy = 59;

    optional int64 sit_vz_ts = 60;
    optional int64 sit_vz_rt = 61;

    reserved 62;

    optional bool is_battery_low = 63;
    optional bool is_battery_critical = 64;

    optional bool is_silent_failure = 65;

    optional int64 violation_uptime_ms = 66;
    optional bool is_ultra_long_stationary = 67;
    optional bool gps_hardware_lock = 68;

    optional int64 rt = 69;

    optional bool is_gnss_throttled = 70;

    optional int32 energy_delta_ma = 71;
    optional double energy_delta_temp = 72;
    optional int64 energy_duration_ms = 73;
    optional string tamper_note = 74;
    optional bool is_power_tamper = 75;

    optional string activity_type = 76;

    optional int64 last_alarm_ack_ts = 77;
    optional int64 violation_start_ts = 78;

    optional int32 current_ma = 79;
    optional double thermal_headroom = 80;
    optional double heap_allocated_mb = 81;
    optional bool is_anchor_locked = 82;
    optional bool is_battery_whitelisted = 83;
    optional bool is_storage_low = 84;
    optional bool is_storage_critical = 85;
    optional bool is_power_save_mode = 86;
    optional int32 standby_bucket = 87;
    optional string net_interface = 88;
    optional string name = 89;
    optional double dist_to_tracker = 90;
    optional double dist_to_home = 91;
    optional string sentinel_status_enum = 92;

    optional double thermal_snapshot = 93;
    optional double heap_snapshot = 94;

    // Issue #AUDIT-1006-9: Protocol Efficiency Optimization
    optional sint32 lat_e7 = 95;
    optional sint32 lng_e7 = 96;
    optional bool is_delta = 97;

    // Issue #QA-1007-1: Forensic Expansion
    optional bool is_muzzled = 98;
    optional bool is_siren_active = 99;
    optional bool is_hardware_online = 100;
    optional bool local_internet_loss = 101;
    optional string suppression_note = 102;
    optional bool is_warming = 103;
    optional double snr_snapshot = 104;
    optional double vibe_snapshot = 105;
    optional int64 acoustic_lockout_rt = 106;
    optional int64 light_spike_rt = 107;
    optional double provided_adaptive_floor = 108;
    optional double acoustic_min_db = 109;

    // Oct.7.7 Anomaly Flags
    optional bool is_suspicious_noise = 110;
    optional bool is_memory_pressure_throttled = 111;

    // Oct.15.11: Proximity Parity
    optional double proximity_cm = 112;
    optional int64 proximity_debounce_ms = 113;

    // Oct.15.12: Vibration Floor Parity
    optional double adaptive_vibration_floor = 114;

    // Oct.22.13: Forensic Parity (Raw Sensor Propagation)
    optional double lux = 115;
    optional double lux_baseline = 116;
    optional double acoustic_db = 117;
    optional double acoustic_floor_db = 118;
    optional double vibration = 119;
    optional double vibration_rolling_sum = 120;

    // Oct.22.14: Session Audit Parity
    optional double violation_percentage = 121;

    // Oct.22.15: Jammer Discrimination Parity
    optional bool is_jamming_candidate = 122;

    // Oct.22.16: Forensic Snapshot Parity
    optional double lux_snapshot = 123;
    optional double acoustic_snapshot = 124;
}

message GeoPointProto {
    optional double lat = 1;
    optional double lng = 2;
}

message AlertSettingsProto {
    optional bool local_internet = 1;
    optional bool server_connection = 2;
    optional bool jammer_detection = 3;
    optional bool signalLoss = 4;
    optional bool gps_stalling = 5;
    optional bool distance = 6;
    optional bool power = 7;
    optional bool low_battery = 8;
    optional bool long_time_gap = 9;
    optional bool high_temperature = 10;
    optional bool override_silence = 11;
    optional bool use_max_volume = 12;
    optional bool vibration_enabled = 13;
    optional float alarm_volume = 14;
    optional bool use_custom_volume = 15;
    optional bool relay_connection = 16;
    optional bool tilt_alert = 17;
    optional bool acoustic_alert = 18;
    optional bool lift_alert = 19;
    optional bool tamper_alert = 20;
    optional bool chair_occupied = 21;
    optional bool global_mute = 22;
    optional bool system_storage_low = 23;
    optional bool battery_health = 24;
}

