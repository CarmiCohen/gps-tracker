    optional int32 battery = 17;
    optional double temp = 18;
    optional bool is_charging = 19;
    optional int32 sats_view = 20;
    optional int32 sats_used = 21;
    optional double alt = 23;
    optional double max_temp = 24;

    reserved 25, 26, 27, 28, 29, 30, 31, 32;

    optional int64 max_drop_ts = 33;
    optional int64 violation_uptime_ms = 34;
    optional double violation_percentage = 35;
    optional bool is_power_tamper = 36;

    optional double vibration = 37;
    optional double heading = 38;
    optional double baro_alt = 39;
    optional double lux = 40;
    optional bool is_near = 41;
    optional double tilt_degrees = 42;
    optional double acoustic_db = 43;
    optional double peak_shock = 44;
    optional int64 peak_shock_ts = 45;
