    optional int32 standby_bucket = 54;
    optional string net_interface = 55;
    optional bool is_storage_low = 56;

    optional bool is_battery_steep_discharge = 57;

    reserved 58;
    optional bool is_cooling_mode_active = 60;
    optional bool is_storage_critical = 61;

    optional int32 current_ma = 62;
    reserved 63;
    optional string tracker_state = 64;
    optional string status = 65;

    optional double kinetic_energy = 66;

    optional int64 sit_vz_ts = 67;
    optional int64 sit_vz_rt = 68;

    reserved 69;

    optional bool is_battery_low = 70;
    optional bool is_battery_critical = 71;

    optional bool is_silent_failure = 72;

    optional int64 last_sit_ts = 73;
    optional double sit_vz = 74;
    optional double sit_dz = 75;
    optional double sit_baro = 76;
    optional double sit_tilt = 77;
    optional double sit_shock = 78;
    optional double vertical_velocity = 79;

    optional int64 rt = 80;
    optional bool is_jammer = 81;
    optional bool is_stalled = 82;
    optional bool is_clock_regression = 83;
    optional int32 jump_tier = 84;
    optional bool is_location_pending = 85;
    optional LocationPendingReasonProto location_pending_reason = 86;
    optional int64 last_valid_fix_rt = 87;
    optional double snr_idx = 88;
    optional double noise_idx = 89;
    optional double lux_idx = 90;
    optional double vibe_idx = 91;
    optional double lift_idx = 92;
    optional double tilt_idx = 93;
    optional double baro_idx = 94;
    optional bool is_sit_detected = 95;
    optional bool is_sit_active = 96;
    optional bool is_ultra_long_stationary = 97;
    optional bool is_jump = 98;
    optional bool mic_pending = 99;

    optional string device_id = 100;
    optional string viewer_id = 101;
    optional double proximity_cm = 102;
    optional int64 proximity_debounce_ms = 103;
    optional double vibration_rolling_sum = 104;
    optional bool is_trajectory_promoted = 105;
    optional bool is_suspicious = 106;
    optional bool is_anchor_locked = 107;
    optional bool is_battery_whitelisted = 108;
    optional bool gps_hardware_lock = 109;

