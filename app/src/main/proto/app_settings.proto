    optional bool is_jamming_candidate = 141;

    // Oct.22.16: Forensic Snapshot Parity
    optional double lux_snapshot = 142;
    optional double acoustic_snapshot = 143;
}

message ActiveAlarmProto {
    optional string type = 1;
    optional string title = 2;
    optional string subtitle = 3;
    optional bool is_triggered = 4;
    optional int64 first_trigger_ts = 5;
    optional int64 first_trigger_rt = 6;
    optional int64 last_log_ts = 7;
    optional int64 last_log_rt = 8;
    optional bool is_resolved = 9;
}

message ActiveAlarmsListProto {
    repeated ActiveAlarmProto alarms = 1;
}
