// Top-level build file where you can add configuration options common to all sub-projects/modules.
plugins {
    alias(libs.plugins.android.application) apply false
    alias(libs.plugins.android.library) apply false
    alias(libs.plugins.kotlin.android) apply false
    alias(libs.plugins.kotlin.jvm) apply false
    alias(libs.plugins.kotlin.serialization) apply false
    alias(libs.plugins.hilt) apply false
    alias(libs.plugins.protobuf) apply false
    alias(libs.plugins.google.services) apply false
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}

def getGitCommitCount() {
    try {
        def process = "git rev-list --count HEAD".execute([], project.rootDir)
        process.waitFor()
        if (process.exitValue() == 0) {
            def count = process.text.trim()
            return count.isInteger() ? count.toInteger() : 1000
        }
        return 1000
    } catch (Exception ignored) {
        return 1000
    }
}

def getVersionName() {
    return "Sep.28.7"
}

ext {
    autoVersionCode = getGitCommitCount()
    autoVersionName = getVersionName()
}

/**
 * Issue #1354: Gradle Task Deduplication
 * Consolidates version integrity, interface validation, and doc sync into a single task
 * to reduce configuration overhead and improve build speed.
 */
tasks.register('verifyProjectIntegrity') {
    group = "verification"
    description = "Consolidated project integrity audit (Version, Interfaces, Docs)"
    doLast {
        // 1. Version Type-Safety Audit (Issue #1036)
        def testCode = rootProject.hasProperty('testVersionCode') ? rootProject.testVersionCode : "INVALID"
        def safeCode = 1000
        try {
            safeCode = testCode.toString().toInteger()
        } catch (Exception e) {
            println "Fallback triggered successfully for malformed version: ${e.message}"
        }
        assert safeCode instanceof Integer
        println "Integrity Audit: PASSED (Version: ${project.autoVersionName}, Code: ${project.autoVersionCode})"

        // 2. Build-Time Interface Validation (Issue #1294)
        def requiredInterfaces = [
            "TimeProvider",
            "BootLifecycleAuthority",
            "PowerStateProvider",
            "NetworkProvider",
            "SignalingTransport",
            "SystemStatusProvider",
            "SignalingProvider"
        ]
        
        def appModuleDir = new File(project.rootDir, "app/src/main/java/com/gps19/app")
        if (appModuleDir.exists()) {
            def moduleFiles = appModuleDir.listFiles().findAll { it.name.endsWith("Module.kt") }
            def combinedContent = moduleFiles.collect { it.text }.join("\n")
            
            def missing = []
            requiredInterfaces.each { inter ->
                def pattern = java.util.regex.Pattern.compile(":\\s*" + inter + "\\b")
                if (!pattern.matcher(combinedContent).find()) {
                    missing.add(inter)
                }
            }
            
            if (!missing.isEmpty()) {
                throw new GradleException("Build-Time Interface Validation FAILED: The following core interfaces are missing Hilt module bindings: ${missing}. Please define @Binds or @Provides in AppModule.kt or PowerModule.kt.")
            }
            println "Build-Time Interface Validation: PASSED (All core service interfaces bound)."
        }

        // 3. Automated Documentation Version Sync (Issue #1034)
        def vName = project.autoVersionName
        def filesToUpdate = [
            'Handover.md', 
            'issues.md', 
            'STATUS/SOT_MASTER_REQUIREMENTS.md',
            'STATUS/RESOLUTION_ARCHIVE.md'
        ]
        filesToUpdate.each { fileName ->
            def file = new File(project.rootDir, fileName)
            if (file.exists()) {
                println "Updating version in ${fileName} to ${vName}..."
                def content = file.text
                def updatedContent = content.replaceAll(/\(v?\w{3}\.\d{2}\.\d{2}\)/, "(${vName})")
                file.text = updatedContent
            }
        }
    }
}

// Lifecycle Integration (R-ID 336) - Optimized via Task Deduplication
subprojects {
    afterEvaluate { subproject ->
        if (subproject.plugins.hasPlugin('com.android.application') || subproject.plugins.hasPlugin('com.android.library')) {
            subproject.tasks.matching { it.name == "preBuild" }.all {
                dependsOn rootProject.tasks.verifyProjectIntegrity
            }
        }
    }
}
